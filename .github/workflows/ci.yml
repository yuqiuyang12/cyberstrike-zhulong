name: ci
on: [push, pull_request]

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Shell 脚本语法检查
        run: |
          for s in scripts/*.sh; do bash -n "$s"; done
      - name: Go 格式检查(不解析上游依赖)
        run: |
          test -z "$(gofmt -l src/)" || { gofmt -l src/; exit 1; }
      - name: 必备文件完整性检查
        run: |
          test -f schema/zhulong.sql
          test -f config/zhulong.example.yaml
          test -f scripts/apply.sh
          test -f README.md

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Clone pinned upstream
        id: clone
        continue-on-error: true
        run: |
          git clone --depth 1 --branch 1.7.17 https://github.com/AIPentest/CyberStrikeAI.git /tmp/base
      - name: Apply zhulong
        if: steps.clone.outcome == 'success'
        run: bash scripts/apply.sh /tmp/base
      - name: Build
        if: steps.clone.outcome == 'success'
        run: cd /tmp/base && go build ./cmd/server
      - name: Test zhulong engine
        if: steps.clone.outcome == 'success'
        run: cd /tmp/base && go test ./internal/zhulong/ -count=1
