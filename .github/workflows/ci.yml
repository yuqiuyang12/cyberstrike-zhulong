name: ci
on: [push, pull_request]

jobs:
  # 不依赖上游源码：所有 fork / 镜像都能跑过的静态检查
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: 必备文件完整性检查
        run: |
          test -f schema/zhulong.sql
          test -f config/zhulong.example.yaml
          test -f scripts/apply.sh
          test -f README.md
      - name: Shell 脚本语法检查
        run: |
          for s in scripts/*.sh; do bash -n "$s"; done

  # 完整构建依赖上游 CyberStrikeAI 基线；上游不可达时自动跳过，不阻断流水线
  build-and-test:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: 拉取上游基线并构建测试(不可达则跳过)
        run: |
          set +e
          git clone --depth 1 --branch 1.7.17 https://github.com/AIPentest/CyberStrikeAI.git /tmp/base
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::上游基线不可达，跳过完整构建与测试（静态检查已通过）"
            exit 0
          fi
          bash scripts/apply.sh /tmp/base
          cd /tmp/base && go build ./cmd/server
          go test ./internal/zhulong/ -count=1
