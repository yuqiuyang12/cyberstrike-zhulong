name: ci
on: [push, pull_request]
jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Clone pinned upstream
        run: |
          # TODO(发布前填写):换成真实上游地址与 tag
          git clone --depth 1 --branch 1.7.17 https://github.com/CHANGE_ME/CyberStrikeAI.git /tmp/base
      - name: Apply zhulong
        run: bash scripts/apply.sh /tmp/base
      - name: Build
        run: cd /tmp/base && go build ./cmd/server
      - name: Test zhulong engine
        run: cd /tmp/base && go test ./internal/zhulong/ -count=1
